<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PlayNook</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="scene">
    <img src="UI.png" class="background">
    <img src="flames.gif" class="flames">
    <img src="title.gif" class="title">
    <img src="rules.png" class="rules-img">

    <!-- Interactive bookshelf -->
    <div class="bookshelf-container">
        <div class="books-row">
            <!-- First row - 3 books -->
            <div class="book-row">
                <!-- Game 1: Tic Tac Toe -->
                <div class="book book-1" data-game="ticTacToe">
                    <div class="book-spine"></div>
                    <div class="book-cover">
                        <div class="book-icon"><i class="fas fa-times"></i></div>
                        <div class="book-title">Tic Tac Toe</div>
                        <div class="book-genre">Strategy</div>
                    </div>
                </div>
                
                <!-- Game 2: Memory Match -->
                <div class="book book-2" data-game="memoryMatch">
                    <div class="book-spine"></div>
                    <div class="book-cover">
                        <div class="book-icon"><i class="fas fa-brain"></i></div>
                        <div class="book-title">Memory Match</div>
                        <div class="book-genre">Puzzle</div>
                    </div>
                </div>
                
                <!-- Game 3: Snake -->
                <div class="book book-3" data-game="snake">
                    <div class="book-spine"></div>
                    <div class="book-cover">
                        <div class="book-icon"><i class="fas fa-snake"></i></div>
                        <div class="book-title">Snake</div>
                        <div class="book-genre">Arcade</div>
                    </div>
                </div>
            </div>
            
            <!-- Second row - 3 books (with spacing from first row) -->
            <div class="book-row">
                <!-- Game 4: Reaction Test -->
                <div class="book book-4" data-game="reactionTest">
                    <div class="book-spine"></div>
                    <div class="book-cover">
                        <div class="book-icon"><i class="fas fa-bolt"></i></div>
                        <div class="book-title">Reaction Test</div>
                        <div class="book-genre">Action</div>
                    </div>
                </div>
                
                <!-- Game 5: Number Guesser -->
                <div class="book book-5" data-game="numberGuesser">
                    <div class="book-spine"></div>
                    <div class="book-cover">
                        <div class="book-icon"><i class="fas fa-question"></i></div>
                        <div class="book-title">Number Guesser</div>
                        <div class="book-genre">Logic</div>
                    </div>
                </div>
                
                <!-- Game 6: Typing Speed -->
                <div class="book book-6" data-game="typingSpeed">
                    <div class="book-spine"></div>
                    <div class="book-cover">
                        <div class="book-icon"><i class="fas fa-keyboard"></i></div>
                        <div class="book-title">Typing Speed</div>
                        <div class="book-genre">Skill</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<div class="game-modal" id="gameModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 class="modal-title" id="modalGameTitle">Game Title</h2>
            <button class="close-modal" id="closeModal"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <div class="game-area" id="gameArea">
                <!-- Game content will be loaded here -->
                <h3 style="color: #8B4513;">Select a game from the bookshelf to play!</h3>
                <p style="color: #A0522D; margin-top: 15px;">Each book on the shelf contains a different mini-game adventure.</p>
            </div>
            <p class="game-instructions" id="gameInstructions">Click on a game book to start playing</p>
            <div class="game-controls" id="gameControls">
                <!-- Game controls will be loaded here -->
            </div>
        </div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
